<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: Shopping Cart Illustration -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Your Store Here - Fresh Quality Groceries Everyday | Supermarket</title>
    <meta name="title" content="Your Store Here - Fresh Quality Groceries Everyday | Supermarket" />
    <meta name="description" content="Order fresh vegetables, fruits, staples, dairy, snacks & household essentials from Your Store Here. Fast 30-minute delivery to your doorstep." />
    <meta name="keywords" content="Your Store Here, supermarket, online grocery, grocery delivery, fresh fruits, vegetables, atta, dal, rice, dairy" />
    <meta name="author" content="Your Store Here" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ea580c" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourstorehere.com/" />
    <meta property="og:title" content="Your Store Here - Fresh Quality Groceries Everyday" />
    <meta property="og:description" content="Shop fresh groceries, produce, packaged goods, and household essentials at unbeatable prices with 30-min express delivery." />
    <meta property="og:image" content="/hero_section.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourstorehere.com/" />
    <meta property="twitter:title" content="Your Store Here - Fresh Quality Groceries Everyday" />
    <meta property="twitter:description" content="Shop fresh groceries, produce, packaged goods, and household essentials at unbeatable prices." />
    <meta property="twitter:image" content="/hero_section.png" />

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD for Local Business & Grocery Store -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GroceryStore",
      "name": "Your Store Here",
      "image": "https://yourstorehere.com/logo.svg",
      "logo": "https://yourstorehere.com/logo.svg",
      "telephone": "+919876543210",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Market Street, Commercial Hub",
        "addressLocality": "Metro City",
        "addressRegion": "State",
        "postalCode": "100001",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "28.6139",
        "longitude": "77.2090"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "10:00",
          "closes": "21:30"
        }
      ],
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash, Credit Card, Debit Card, UPI, NetBanking",
      "servesCuisine": "Groceries, Fresh Produce, Household Essentials"
    }
    </script>
  </head>
  <body class="bg-[#fdfcfb] text-slate-800 antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
